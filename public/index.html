<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ ImageCompress - 高效圖片壓縮工坊</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- 引入 Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <div class="container">
        <header class="page-heading">
          <h1 class="app-title">
            ⚡ ImageCompress
            <span class="app-subtitle">高效圖片壓縮工坊</span>
          </h1>
        </header>

        <div class="workspace-grid">
          <section class="surface-card form-surface">
            <div class="section-heading">
              <h2>選擇圖片並設定輸出品質</h2>
            </div>

            <form id="uploadForm">
              <div class="form-group">
                <label for="imageInput">1. 選擇要壓縮的圖片</label>
                <div class="file-dropzone" id="fileDropzone">
                  <input
                    type="file"
                    id="imageInput"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                  />
                  <div class="dropzone-copy">
                    <strong id="dropzoneTitle"
                      >拖曳圖片到這裡，或點擊挑選檔案</strong
                    >
                    <span id="dropzoneHint">支援 JPEG、PNG、WebP</span>
                    <div
                      class="dropzone-selected-files hidden"
                      id="selectedFilesList"
                      aria-live="polite"
                    ></div>
                  </div>
                </div>
              </div>

              <div class="form-group">
                <label>2. 選擇輸出格式（轉檔）</label>
                <div
                  class="btn-group format-group"
                  role="group"
                  aria-label="選擇輸出格式"
                >
                  <input
                    type="radio"
                    class="btn-check"
                    name="changeType"
                    id="format-original"
                    value=""
                    checked
                  />
                  <label class="btn btn-outline-primary" for="format-original"
                    >壓縮</label
                  >

                  <input
                    type="radio"
                    class="btn-check"
                    name="changeType"
                    id="format-jpeg"
                    value="jpeg"
                  />
                  <label class="btn btn-outline-primary" for="format-jpeg"
                    >JPG</label
                  >

                  <input
                    type="radio"
                    class="btn-check"
                    name="changeType"
                    id="format-png"
                    value="png"
                  />
                  <label class="btn btn-outline-primary" for="format-png"
                    >PNG</label
                  >

                  <input
                    type="radio"
                    class="btn-check"
                    name="changeType"
                    id="format-webp"
                    value="webp"
                  />
                  <label class="btn btn-outline-primary" for="format-webp"
                    >WebP</label
                  >
                </div>
              </div>

              <div class="form-group">
                <label for="qualityInput">3. 設定壓縮品質</label>
                <input
                  type="range"
                  id="qualityInput"
                  min="1"
                  max="100"
                  value="80"
                />
                <div class="quality-display">
                  <span>品質等級</span>
                  <span class="quality-value" id="qualityValue">80</span>
                </div>
              </div>

              <button type="submit" id="submitBtn">開始壓縮圖片</button>
            </form>
          </section>
        </div>

        <div class="results-stack">
          <div id="resultArea" class="hidden-section">
            <div class="surface-card batch-summary">
              <div class="batch-summary-header">
                <h3>批量處理結果</h3>
                <div class="batch-summary-actions">
                  <span class="result-badge" id="batchStatusText">Ready</span>
                  <button
                    type="button"
                    id="resetResultsBtn"
                    class="btn btn-sm btn-outline-danger reset-results-btn"
                  >
                    清空結果
                  </button>
                  <button
                    type="button"
                    id="clearResultsBtn"
                    class="btn btn-sm btn-outline-primary clear-results-btn"
                  >
                    一鍵下載
                  </button>
                </div>
              </div>
              <div class="batch-summary-metrics">
                <span>總數 <strong id="batchTotalCount">0</strong></span>
                <span>成功 <strong id="batchSuccessCount">0</strong></span>
                <span>失敗 <strong id="batchFailCount">0</strong></span>
              </div>
            </div>

            <div id="resultList" class="result-list"></div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="feedbackModal"
      tabindex="-1"
      aria-labelledby="feedbackModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="feedbackModalLabel">系統訊息</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body" id="feedbackModalBody"></div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              data-bs-dismiss="modal"
            >
              我知道了
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="main.js"></script>
  </body>
</html>
